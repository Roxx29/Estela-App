name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["server/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYINSTALLER: "6.11.1"  # mismo que build.bat

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==${{ env.PYINSTALLER }}

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Icono
        run: python tools/make_icon.py

      - name: Ejecutable
        run: pyinstaller Estela.spec --noconfirm --clean

      - uses: actions/upload-artifact@v4
        with:
          name: Estela-windows
          path: dist/Estela
          retention-days: 30

      - name: Comprimir
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/Estela -DestinationPath "Estela-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Estela-${{ github.ref_name }}.zip
