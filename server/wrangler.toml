name = "estela-servidor"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "SALAS"
class_name = "SalaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalaDO"]

# Límite por IP (conexiones y salas nuevas por minuto)
[[ratelimits]]
name = "LIMITE_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMITE_CREAR"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
